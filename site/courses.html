<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses · LMS-Mark Academy</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="zoho-config.js?v=2"></script>
  <script src="courses.js?v=2"></script>
  <script src="app.js?v=2"></script>
</head>
<body data-page="courses">
  <header id="site-header"></header>

  <main>
    <section>
      <div class="wrap">
        <h2>All courses</h2>
        <p class="section-lead">Self-paced video lessons with a short quiz and a certificate at the end.</p>
        <div class="grid" id="catalog"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script>
    const palette = ["#3b4cca", "#0f9d8a", "#c2416b", "#b8741a"];
    document.getElementById("catalog").innerHTML = window.COURSES.map((c, i) => `
      <article class="card">
        <div class="card-art" style="background:${palette[i % palette.length]}">${c.title}</div>
        <div class="card-body">
          <span class="meta">${c.level} · ${c.duration} · ${c.lessons} lessons</span>
          <p class="muted" style="margin:0">${c.summary}</p>
          <span class="price">${formatPrice(c.price)}</span>
          <a class="btn" href="course.html?id=${c.id}">View course</a>
        </div>
      </article>`).join("");
  </script>
</body>
</html>
